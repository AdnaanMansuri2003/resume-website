<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Browser tab icon. Mirrors components/Logo.tsx: a dark tile so the mark
       holds up on light tab bars, with a sky glyph so it holds up on dark ones. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101c33"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <!-- userSpaceOnUse: the crossbar is a horizontal line, so its bounding box
         has no height and an objectBoundingBox gradient would not render. -->
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse"
                    x1="8.6" y1="8" x2="23.4" y2="24">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="9" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="8.5" fill="none"
        stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
  <g fill="none" stroke="url(#glyph)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.6 24 16 8l7.4 16"/>
    <path d="M11.7 19h8.6"/>
  </g>
</svg>
